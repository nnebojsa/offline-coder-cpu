# setup.conf - Konfiguration für offline-coder-cpu
#
# Ausgelegt für ein Notebook mit 4 CPU-Kernen ohne dedizierte GPU
# (z.B. HP EliteBook 850 G8, i5-1135G7 mit 16 GB RAM). Empfohlen ist ein
# verschlüsselter Datenträger für das Projektverzeichnis (siehe
# REQUIRE_ENCRYPTION).
#
# Format: Shell-Variablen (SCHLÜSSEL=WERT), Kommentare beginnen mit '#'.
# Werte mit Leerzeichen in Anführungszeichen setzen.
# Fehlt ein Schlüssel, gilt der in common.sh hinterlegte Standardwert.
#
# Nach jeder Änderung: ./setup.sh
# setup.sh prüft die Werte, lädt fehlende Modelle, erzeugt daraus .env und
# legt die Container neu an. Daten und Modelle bleiben dabei erhalten.

# ---------------------------------------------------------------------------
# Pfade (relative Pfade beziehen sich auf das Projektverzeichnis)
# ---------------------------------------------------------------------------

# Ablage der GGUF-Modelle (mehrere GB, ein Pfad mit ausreichend Platz).
# Der Standard liegt im Projektverzeichnis, also auf demselben Datenträger.
MODELS_DIR=./models

# Daten von Open WebUI: Konten, Chats, Projekte (Ordner), Wissen, Uploads
WEBUI_DATA_DIR=./data/webui

# ---------------------------------------------------------------------------
# Netzwerk
# ---------------------------------------------------------------------------

# Adresse, an die die Ports auf dem Host gebunden werden.
# 127.0.0.1 = nur lokal erreichbar. 0.0.0.0 macht die Oberfläche im ganzen
# Netz erreichbar und ist nur mit WEBUI_AUTH=1 vertretbar.
BIND_ADDRESS=127.0.0.1

# Port der Oberfläche: http://127.0.0.1:3000
WEBUI_PORT=3000

# Quelle für Modell-Downloads (z.B. ein interner Mirror)
HF_ENDPOINT=https://huggingface.co

# ---------------------------------------------------------------------------
# Open WebUI
# ---------------------------------------------------------------------------

# Feste Version für reproduzierbare Installationen. Rollierend: :main
WEBUI_IMAGE=ghcr.io/open-webui/open-webui:v0.12.1

# 1 = Anmeldung mit lokalem Konto (das erste Konto wird Admin)
# 0 = ohne Anmeldung, nur bei einer neuen Installation möglich (leeres
#     WEBUI_DATA_DIR). Sobald ein Konto existiert, lehnt Open WebUI das ab.
WEBUI_AUTH=1

# Sprache beim ersten Aufruf, leer = Sprache des Browsers
WEBUI_LOCALE=de-DE

# 1 = keine Downloads und Update-Prüfungen durch Open WebUI.
# Das Embedding-Modell für Wissen/Dateien wird von setup.sh aus dem Image
# übernommen, ein Download ist dafür nicht notwendig.
WEBUI_OFFLINE=1

# Automatische Chat-Titel durch das Modell. Auf der CPU kostet jeder Titel
# eine zusätzliche Anfrage und verdrängt den Prompt-Cache des Chats.
# 0 = der Anfang der ersten Nachricht wird zum Titel
WEBUI_TITLE_GENERATION=0

# Weitere Hintergrund-Aufgaben: Tags, Folgefragen, Eingabe-Vervollständigung,
# Suchanfragen für Wissen und Websuche. 0 = aus (empfohlen für CPU)
WEBUI_BACKGROUND_TASKS=0

# Maximale Dauer einer Anfrage an das Modell in Sekunden
WEBUI_REQUEST_TIMEOUT=1800

# Open WebUI übernimmt die Werte aus diesem Abschnitt standardmäßig nur
# beim ersten Start, danach gelten die Einstellungen im Admin-Panel.
# 1 = Werte aus setup.conf gelten bei jedem Start. Achtung: Änderungen im
#     Admin-Panel an allen Einstellungen gehen dann beim Neustart verloren.
WEBUI_CONFIG_FROM_ENV=0

# ---------------------------------------------------------------------------
# Chat-Modell (llama-server)
# ---------------------------------------------------------------------------
#
# Jeder Block legt ein Modell fest: Hugging-Face-Repo, Dateiname, Kontext
# und Sampling-Profil gehören zusammen. Genau ein Block ist aktiv, die
# übrigen bleiben auskommentiert. Bei mehreren aktiven Blöcken gilt der
# letzte. setup.sh lädt die Datei nach MODELS_DIR, falls sie dort fehlt.
#
# Auf der CPU sind nur Modelle mit wenigen aktiven Parametern je Token
# schnell genug (MoE-Modelle mit ca. 3-4 Mrd. aktiven Parametern bzw. das
# 9B-Modell). Die Größen sind die Dateigrößen, wie setup.sh sie anzeigt.
#
# Sampling-Profile (Empfehlungen aus den Model Cards der Hersteller):
#   qwen        Qwen3.5 / Qwen3.6
#   qwen-coder  Qwen3-Coder-Next
#   gemma       Gemma 4
#   default     Standardwerte von llama.cpp

# --- 16 GB RAM: Standard ---------------------------------------------------
# Qwen3.5-9B, Alibaba, Apache 2.0, ca. 6 GB
CHAT_MODEL_REPO=unsloth/Qwen3.5-9B-GGUF
CHAT_MODEL_FILE=Qwen3.5-9B-UD-Q4_K_XL.gguf
CHAT_CTX=16384
CHAT_SAMPLING=qwen

# --- 64 GB RAM: Standard ---------------------------------------------------
# Qwen3.6-35B-A3B, Alibaba, Apache 2.0, MoE 35B / 3B aktiv, ca. 21 GB
#CHAT_MODEL_REPO=unsloth/Qwen3.6-35B-A3B-GGUF
#CHAT_MODEL_FILE=Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
#CHAT_CTX=32768
#CHAT_SAMPLING=qwen

# --- 64 GB RAM: Alternative zum Vergleich ----------------------------------
# Gemma 4 26B-A4B, Google, Apache 2.0, MoE 25B / 3,8B aktiv, ca. 16 GB
#CHAT_MODEL_REPO=unsloth/gemma-4-26B-A4B-it-GGUF
#CHAT_MODEL_FILE=gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
#CHAT_CTX=32768
#CHAT_SAMPLING=gemma

# --- 64 GB RAM: Coding-Spezialist, nur mit wenigen weiteren Programmen -----
# Qwen3-Coder-Next, Alibaba, Apache 2.0, MoE 80B / 3B aktiv, 3-Bit,
# ca. 34 GB, kein Denk-Modus
#CHAT_MODEL_REPO=unsloth/Qwen3-Coder-Next-GGUF
#CHAT_MODEL_FILE=Qwen3-Coder-Next-UD-Q3_K_XL.gguf
#CHAT_CTX=32768
#CHAT_SAMPLING=qwen-coder

# Modellname in Open WebUI. Bleibt beim Modellwechsel gleich, damit
# Projekte und Standardmodell weiter passen.
CHAT_ALIAS=local-chat

# CPU-Threads, auto = Anzahl physischer Kerne
CHAT_THREADS=auto

# 0 = Denk-Modus aus (deutlich schneller auf der CPU), 1 = an.
# Qwen3-Coder-Next hat keinen Denk-Modus, der Wert hat dort keine Wirkung.
CHAT_THINKING=0

# Zusätzliche llama-server-Argumente, z.B. halbiert
# "--cache-type-k q8_0 --cache-type-v q8_0" den RAM-Bedarf des Kontexts
CHAT_EXTRA_ARGS=""

# ---------------------------------------------------------------------------
# Autovervollständigung für VS Code (optional, Erweiterung llama-vscode)
# ---------------------------------------------------------------------------

# 1 = zusätzlicher llama-server für Code-Vervollständigung, ca. 2 GB RAM
AUTOCOMPLETE=0
FIM_MODEL_REPO=ggml-org/Qwen2.5-Coder-1.5B-Q8_0-GGUF
FIM_MODEL_FILE=qwen2.5-coder-1.5b-q8_0.gguf
FIM_PORT=8012
# Weniger Threads, damit der Chat parallel weiterläuft
FIM_THREADS=2
FIM_EXTRA_ARGS=""

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------

# Basis-Image für llama-server. Rollierend: :server, fest: Versions-Tag
LLAMA_CPP_IMAGE=ghcr.io/ggml-org/llama.cpp:server

# Name des lokal gebauten llama-server-Images
LLM_IMAGE=localhost/offline-coder-cpu-llama:latest

# ---------------------------------------------------------------------------
# Prüfungen in setup.sh
# ---------------------------------------------------------------------------

# Mindestgröße des Arbeitsspeichers in GB. Bis zu 10 % Abweichung werden
# toleriert, da Firmware und Grafik einen Teil des RAM reservieren.
MIN_RAM_GB=16

# RAM in GB, der für System, Desktop, Browser und VS Code freigehalten wird.
# Fließt in die Abschätzung des RAM-Bedarfs ein. Ohne Desktop-Nutzung: 2
RESERVED_RAM_GB=6

# Freier Platz für den Podman-Speicher (Images) in GB
MIN_IMAGE_SPACE_GB=8

# Prüfung, ob die Daten von Open WebUI und das Projektverzeichnis
# (Sitzungsschlüssel) auf einem mit LUKS/dm-crypt verschlüsselten
# Datenträger liegen. Empfohlen, aber keine Voraussetzung.
# 0 = nur Hinweis (Warnung), die Einrichtung läuft weiter
# 1 = Abbruch bei unverschlüsselter Ablage
REQUIRE_ENCRYPTION=0
